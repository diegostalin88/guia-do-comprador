name: Atualizar dados

on:
  schedule:
    - cron: "17 11 * * 1"   # toda segunda, 08:17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/dados.yml"]

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Taxa média de juros (Banco Central)
        run: python scripts/atualizar_taxas.py
      - name: Preço dos combustíveis (ANP)
        run: python scripts/atualizar_combustivel.py
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "dados: atualização automática $(date -u +%F)"
          git push
